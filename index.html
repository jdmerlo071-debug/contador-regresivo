<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Cuenta Regresiva</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            text-align: center;
            background-color: #121212;
            color: white;
            padding: 50px;
        }
        .countdown {
            font-size: 3rem;
            font-weight: bold;
            margin: 20px 0;
            letter-spacing: 2px;
        }
        button {
            background-color: #007bff;
            color: white;
            border: none;
            padding: 12px 24px;
            font-size: 1rem;
            border-radius: 5px;
            cursor: pointer;
            transition: 0.3s;
        }
        button:hover {
            background-color: #0056b3;
        }
    </style>
</head>
<body>

    <h1>Faltan para el 10 de Septiembre:</h1>
    <div class="countdown" id="timer">Cargando...</div>
    
    <button onclick="compartirEnlace()">Compartir este contador</button>

    <script>
        // Definir la fecha objetivo (10 de septiembre a las 24:00 es el inicio del 11 de septiembre)
        const fechaObjetivo = new Date('September 11, 2026 00:00:00').getTime();

        const x = setInterval(function() {
            const ahora = new Date().getTime();
            const distancia = fechaObjetivo - ahora;

            // Cálculos de tiempo para días, horas, minutos y segundos
            const dias = Math.floor(distancia / (1000 * 60 * 60 * 24));
            const horas = Math.floor((distancia % (1000 * 60 * 60 * 24)) / (1000 * 60 * 60));
            const minutos = Math.floor((distancia % (1000 * 60 * 60)) / (1000 * 60));
            const segundos = Math.floor((distancia % (1000 * 60)) / 1000);

            // Mostrar el resultado en el elemento con id="timer"
            document.getElementById("timer").innerHTML = dias + "d " + horas + "h "
            + minutos + "m " + segundos + "s ";

            // Si la cuenta regresiva termina
            if (distancia < 0) {
                clearInterval(x);
                document.getElementById("timer").innerHTML = "¡Tiempo cumplido!";
            }
        }, 1000);

        // Función para compartir el enlace actual
        function compartirEnlace() {
            if (navigator.share) {
                navigator.share({
                    title: 'Cuenta Regresiva',
                    text: '¡Mira cuánto falta para el 10 de septiembre!',
                    url: window.location.href
                }).catch(console.error);
            } else {
                navigator.clipboard.writeText(window.location.href);
                alert("¡Enlace copiado al portapapeles!");
            }
        }
    </script>

</body>
</html>
