<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Cuenta Regresiva Especial</title>
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background: linear-gradient(135deg, #0f172a 0%, #1e1b4b 100%);
            color: #ffffff;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            min-height: 100vh;
            padding: 20px;
            text-align: center;
        }
        h1 {
            font-size: 2rem;
            margin-bottom: 30px;
            color: #38bdf8;
            text-shadow: 0 2px 10px rgba(56, 189, 248, 0.2);
        }
        .countdown-container {
            display: flex;
            gap: 15px;
            flex-wrap: wrap;
            justify-content: center;
            margin-bottom: 40px;
        }
        .time-box {
            background: rgba(255, 255, 255, 0.05);
            backdrop-filter: blur(10px);
            border: 1px solid rgba(255, 255, 255, 0.1);
            padding: 20px;
            border-radius: 12px;
            min-width: 90px;
            box-shadow: 0 8px 32px rgba(0, 0, 0, 0.3);
        }
        .time-number {
            font-size: 3rem;
            font-weight: 800;
            color: #f43f5e;
            display: block;
            line-height: 1;
            margin-bottom: 5px;
        }
        .time-label {
            font-size: 0.8rem;
            text-transform: uppercase;
            letter-spacing: 1px;
            color: #94a3b8;
        }
        .share-btn {
            background: linear-gradient(135deg, #06b6d4 0%, #3b82f6 100%);
            color: white;
            border: none;
            padding: 15px 35px;
            font-size: 1.1rem;
            font-weight: 600;
            border-radius: 50px;
            cursor: pointer;
            box-shadow: 0 4px 15px rgba(59, 130, 246, 0.4);
            transition: transform 0.2s, box-shadow 0.2s;
        }
        .share-btn:hover {
            transform: translateY(-2px);
            box-shadow: 0 6px 20px rgba(59, 130, 246, 0.6);
        }
        .share-btn:active {
            transform: translateY(0);
        }
    </style>
</head>
<body>

    <h1>Tiempo restante para el 10 de Septiembre:</h1>
    
    <div class="countdown-container">
        <div class="time-box"><span class="time-number" id="days">00</span><span class="time-label">Días</span></div>
        <div class="time-box"><span class="time-number" id="hours">00</span><span class="time-label">Horas</span></div>
        <div class="time-box"><span class="time-number" id="minutes">00</span><span class="time-label">Min</span></div>
        <div class="time-box"><span class="time-number" id="seconds">00</span><span class="time-label">Seg</span></div>
    </div>
    
    <button class="share-btn" onclick="compartirEnlace()">✨ Compartir este contador</button>

    <script>
        // Fecha objetivo: 10 de Septiembre a las 24:00 (es decir, inicio del 11 de Septiembre)
        const fechaObjetivo = new Date('September 11, 2026 00:00:00').getTime();

        const x = setInterval(function() {
            const ahora = new Date().getTime();
            const distancia = fechaObjetivo - ahora;

            const dias = Math.floor(distancia / (1000 * 60 * 60 * 24));
            const horas = Math.floor((distancia % (1000 * 60 * 60 * 24)) / (1000 * 60 * 60));
            const minutos = Math.floor((distancia % (1000 * 60 * 60)) / (1000 * 60));
            const segundos = Math.floor((distancia % (1000 * 60)) / 1000);

            // Insertar los números formateados con un cero adelante si son menores a 10
            document.getElementById("days").innerText = dias < 10 ? "0" + dias : dias;
            document.getElementById("hours").innerText = horas < 10 ? "0" + horas : horas;
            document.getElementById("minutes").innerText = minutos < 10 ? "0" + minutos : minutos;
            document.getElementById("seconds").innerText = segundos < 10 ? "0" + segundos : segundos;

            if (distancia < 0) {
                clearInterval(x);
                document.querySelector(".countdown-container").innerHTML = "<h2>¡Llegó el momento!</h2>";
            }
        }, 1000);

        function compartirEnlace() {
            if (navigator.share) {
                navigator.share({
                    title: '¡Cuenta Regresiva!',
                    text: 'Mira cuánto falta para el 10 de septiembre',
                    url: window.location.href
                }).catch(console.error);
            } else {
                navigator.clipboard.writeText(window.location.href);
                alert("¡Enlace copiado al portapapeles! Ya puedes pegarlo donde quieras.");
            }
        }
    </script>

</body>
</html>
